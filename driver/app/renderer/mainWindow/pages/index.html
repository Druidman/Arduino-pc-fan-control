<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../styles/indexStyles.css">
    <title>PcFanController</title>
</head>
<body>
    
    <section id="CaseFanControl">
        <div class="controlHolder">
            <input type="range" min="1" max="100" id="speedSlider" class="slider">
            <input type="number" id="CaseFanMode" class="input" min="0" max="28">
            <button id="submitCaseFanMode">Submit Mode</button>
        </div>
        <div class="controlHolder">
            <button id="switchCaseFanColor">switch color</button>
            <button id="shutdown">shutdown</button>
        </div>
        <div class="controlHolder">
            <button id="submitAIO">SUBMIT AIO</button>
            
            <input type="color" id="aioColor" value="#ff0000">

        </div>
        

    </section>
    <section id="fanStats">

    </section>
    
</body>
<script src="../dom/index.js" type="module"></script>
</html>
